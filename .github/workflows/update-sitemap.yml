
name: Update Appigo Sitemap

on:
  push:
    branches:
      - main
    paths:
      - "data/games.json"
      - "scripts/generate_sitemap.py"
      - ".github/workflows/update-sitemap.yml"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate sitemap
        run: python scripts/generate_sitemap.py

      - name: Commit updated sitemap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m "Update sitemap automatically"
            git push
          else
            echo "Sitemap is already up to date."
          fi
